[mod-name]
world-edge-dead-zone=World Edge Dead Zone

[mod-description]
world-edge-dead-zone=Keeps a band of plain buildable land along the edges of finite-size maps (such as ribbon worlds): no resources, water, cliffs, trees, rocks, decoratives or enemy bases.

[mod-setting-name]
world-edge-dead-zone-width=Dead zone width
world-edge-dead-zone-tile=Dead zone fill tile
world-edge-dead-zone-apply-to-width=Also apply to left/right edges
world-edge-dead-zone-all-surfaces=Apply to all surfaces

[mod-setting-description]
world-edge-dead-zone-width=Width of the dead zone in tiles, measured inward from each finite map edge. 0 disables the mod. If the map is too small, the zone is reduced so at least 32 tiles of playable middle remain.
world-edge-dead-zone-tile=Tile used to fill the dead zone. Water, lava and every other tile in the zone are replaced by it.
world-edge-dead-zone-apply-to-width=Also create dead zones at the left/right edges when the map width is finite. The top/bottom edges are always used when the map height is finite.
world-edge-dead-zone-all-surfaces=Apply the dead zone to every planet/surface. If disabled, only Nauvis is affected.

[world-edge-dead-zone]
clamped=[World Edge Dead Zone] Surface '__1__': map __2__ is __3__ tiles, too small for a dead zone of __4__ tiles on both sides. Zone reduced to __5__ tiles to keep a playable middle of at least __6__ tiles.
disabled-axis=[World Edge Dead Zone] Surface '__1__': map __2__ is __3__ tiles, too small for any dead zone while keeping __4__ playable tiles. The dead zone is disabled on this axis.
